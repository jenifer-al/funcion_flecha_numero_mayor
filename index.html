<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>NÚMERO MAYOR FUNCIÓN FLECHA </title>
    
    <style>
        /* Forzamos el color del placeholder por si decides añadirlo en el futuro */
        .input-personalizado::placeholder {
            color: #0e7490 !important; /* cyan-700 */
            opacity: 0.7 !important;
        }
    </style>
</head>

<body class="w-full mx-auto bg-linear-to-r from-cyan-300 to-cyan-200">

    <header class="w-full border-4 rounded-2xl border-cyan-700 border-dashed mt-2 px-4 py-4 bg-linear-to-r from-cyan-600 to-cyan-100 mx-auto sm:w-full sm:border-6 sm:py-5 md:w-full md:border-8 md:py-6 lg:w-full lg:max-w-[900px] lg:ml-14 lg:mr-20 lg:py-7 xl:w-full xl:max-w-[1100px] xl:py-8 2xl:max-w-[1600px] 2xl:ml-auto 2xl:mr-auto 2xl:py-10">
        <h1 class="text-center text-cyan-900 font-bold leading-tight text-xl sm:text-2xl md:text-3xl lg:text-4xl xl:text-5xl 2xl:text-6xl">
            NÚMERO MAYOR FUNCIÓN FLECHA 
        </h1>
    </header>

    <main class="max-w-[1920px] mx-auto px-4 pb-12 w-full sm:w-full md:w-full lg:w-full xl:w-full">

        <details class="mt-8 mb-8 rounded-2xl bg-cyan-50 border border-cyan-200 sm:mt-10 sm:mb-10 md:mt-12 md:mb-12 lg:mt-14 lg:mb-14 xl:mt-16 xl:mb-16">
            <summary class="bg-linear-to-r from-cyan-800 to-cyan-600 rounded-2xl text-white p-3 font-bold cursor-pointer transition-all focus:outline-none text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl">
                Determinar número mayor
            </summary>
            <p class="p-4 text-cyan-900 leading-relaxed text-sm sm:text-base md:text-md lg:text-lg xl:text-xl">
                Crear un nuevo repositorio y copiar todos los ejercicios condicionales allí 
                <a class="text-cyan-700 font-bold underline hover:text-cyan-900" href="https://contenido-vario.github.io/js1/condicionales.html">(Ejercicios condicionales).</a> 
                Cambiar todas las funciones tradicionales por funciones flecha.
            </p>
        </details>

        <div class="flex flex-col items-center gap-8 mt-4 sm:gap-10 md:gap-12 lg:gap-14 xl:flex-row xl:items-start xl:justify-center xl:gap-16">

            <div class="flex flex-col gap-5 border-2 rounded-2xl bg-cyan-600 border-cyan-700 shadow-sm w-full p-5 md:w-11/12 md:p-6 xl:w-7/12 xl:p-8 2xl:w-full 2xl:max-w-[1000px] 2xl:p-8">
            
                <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between w-full">
                    <label class="text-white font-bold text-sm sm:text-base md:text-lg 2xl:text-2xl" for="numerouno">Número uno:</label>
                    <input class="border-2 text-sm rounded-2xl border-cyan-700 bg-cyan-100 text-center text-cyan-950 font-extrabold p-2 w-full sm:w-2/3 md:text-base lg:text-sm xl:text-sm 2xl:text-2xl 2xl:p-2.5" 
                           type="number" id="numerouno" placeholder="Primer número">
                </div>

                <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between w-full">
                    <label class="text-white font-bold text-sm sm:text-base md:text-lg 2xl:text-2xl" for="numerodos">Número dos:</label>
                    <input class="border-2 text-sm rounded-2xl border-cyan-700 bg-cyan-100 text-center text-cyan-950 font-extrabold p-2 w-full sm:w-2/3 md:text-base lg:text-sm xl:text-sm 2xl:text-2xl 2xl:p-2.5" 
                           type="number" id="numerodos" placeholder="Segundo número">
                </div>

                <div class="flex flex-col items-center gap-4 w-full mt-2 sm:flex-row sm:justify-between">
             
        <button  class=" border-2 rounded-2xl border-green-700 text-white font-bold bg-green-700 cursor-pointer transition-all duration-300 ease-in-out
                     hover:shadow-xl  hover:shadow-green-400  hover:scale-105 active:scale-95 shadow-sm px-6 py-2.5 w-auto sm:w-auto md:w-auto lg:w-auto lg:text-sm lg:px-4 lg:py-1.5 
                      xl:w-auto xl:text-sm xl:px-4 xl:py-1.5 2xl:w-auto 2xl:text-2xl 2xl:px-8 2xl:py-2.5 "  type="button " onclick="mostrar()">MOSTRAR</button>

   

        <p class=" text-white w-1/2 ml-25 mt-3 " id="resultado">  </p>

         </div>

            </div>

            <div class="w-full px-4 flex justify-center sm:w-11/12 md:w-4/5 lg:w-2/3 xl:w-4/12 xl:px-0 max-w-[550px]">
                <img class="w-full h-auto object-contain rounded-2xl drop-shadow-lg border-2 border-dashed border-cyan-700 bg-white/20 p-2" src="imagenes/numeros.png" alt="imagen de simbolos de comparación"/>
            </div>
     

    </div>

    </main>

    <script src="js/flecha.js"></script>

</body>

</html>
